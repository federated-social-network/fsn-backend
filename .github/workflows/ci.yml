name: CI-CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make dev

      - name: Check code formatting
        run: |
          black --check app/ tests/ --line-length=120
          isort --check-only app/ tests/ --profile black

      - name: Lint code
        run: |
          flake8 app/ tests/ \
          --max-line-length=120 \
          --exclude=__pycache__ \
          --ignore=E712,E722,F841,E501

      - name: Run test suite
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test_secret_key_for_ci
          INSTANCE_NAME: TestInstance
          BASE_URL: http://localhost:8000
          SUPABASE_SERVICE_KEY: test_key
          SUPABASE_URL: https://test.supabase.co
          GROQ_API_KEY: test_groq_key
        run: |
          make test


  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/thematic-gift-452604-q2/heliix-repo/instance-a:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push us-central1-docker.pkg.dev/thematic-gift-452604-q2/heliix-repo/instance-a:${{ github.sha }}


  deploy:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy instance-a \
            --image us-central1-docker.pkg.dev/thematic-gift-452604-q2/heliix-repo/instance-a:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated